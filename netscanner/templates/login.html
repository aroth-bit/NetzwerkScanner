<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetzwerkScanner Anmeldung</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>
<div class="login-wrap">
  <form class="card login" method="post">
    <div class="brand" style="margin-bottom:14px"><img src="{{ url_for('static', filename='favicon.svg') }}" width="28" alt=""> NetzwerkScanner</div>
    {% if setup %}
      <h2>Ersteinrichtung</h2>
      <p class="muted small">Legen Sie ein Passwort fuer das Dashboard fest. Erst danach ist der Zugriff aus dem Netzwerk moeglich.</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="Neues Passwort (min. 8 Zeichen)" autofocus required minlength="8">
      <input type="password" name="password2" placeholder="Passwort wiederholen" required minlength="8">
      <button class="primary" type="submit" style="width:100%;justify-content:center">Passwort speichern</button>
    {% else %}
      <h2>Anmelden</h2>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="Passwort" autofocus required>
      <button class="primary" type="submit" style="width:100%;justify-content:center">Anmelden</button>
    {% endif %}
    <p class="muted small" style="margin-top:14px">Version {{ version }}</p>
  </form>
</div>
</body>
</html>
