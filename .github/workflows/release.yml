# Baut bei jedem Versions-Tag (z.B. v1.1.0) die Installationspakete und veroeffentlicht sie als
# GitHub-Release. Von dort installieren die Skripte install-from-github.* und der Update-Button.
#
#   Neue Version:  netscanner/__init__.py -> __version__ anpassen, committen, dann
#                  git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version pruefen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content netscanner/__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zu __version__ $v" }
      - name: Windows-Paket bauen (PyInstaller + Inno Setup)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build_windows.ps1 -Python python
      - name: EXE-Selbsttest
        shell: pwsh
        run: dist/NetzwerkScanner/NetzwerkScanner.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NetzwerkScanner-*-Windows.zip
            dist/NetzwerkScanner-Setup-*.exe
            dist/NetzwerkScanner-Installer.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements.txt
          python tests/test_web.py --no-ssh
          python tests/test_ssh_compat.py
      - name: Linux-Paket bauen
        run: python installer/linux/build_linux_package.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/NetzwerkScanner-*-Linux.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "NetzwerkScanner ${{ github.ref_name }}" \
            --generate-notes
