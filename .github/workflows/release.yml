# Baut bei jedem Versions-Tag (z.B. v1.1.0) die Installationspakete und veroeffentlicht sie als
# GitHub-Release. Von dort installieren die Skripte install-from-github.* und der Update-Button.
#
#   Neue Version:  netscanner/__init__.py -> __version__ anpassen, committen, dann
#                  git tag v1.2.0 && git push origin v1.2.0
#   oder ohne Git: GitHub -> Actions -> Release -> "Run workflow" (Branch main). Der Workflow legt
#                  dann den Tag v<__version__> und das Release selbst an.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version pruefen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content netscanner/__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zu __version__ $v" }
      - name: Windows-Paket bauen (PyInstaller + Inno Setup)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build_windows.ps1 -Python python
      - name: EXE-Selbsttest
        shell: pwsh
        run: dist/NetzwerkScanner/NetzwerkScanner.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NetzwerkScanner-*-Windows.zip
            dist/NetzwerkScanner-Setup-*.exe
            dist/NetzwerkScanner-Installer.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements.txt
          python tests/test_web.py --no-ssh
          python tests/test_ssh_compat.py
      - name: Linux-Paket bauen
        run: python installer/linux/build_linux_package.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/NetzwerkScanner-*-Linux.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag bestimmen
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' netscanner/__init__.py)
            [ -n "$v" ] || { echo "__version__ nicht gefunden"; exit 1; }
            echo "name=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          ls -la dist
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits - bitte __version__ erhoehen."; exit 1
          fi
          # Beim manuellen Start legt gh den Tag auf dem gebauten Commit an
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NetzwerkScanner $TAG" \
            --generate-notes
